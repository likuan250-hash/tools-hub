<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>网盘跨盘转存</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: rgba(30, 34, 42, 0.72);
    --panel-2: rgba(38, 43, 53, 0.6);
    --border: rgba(255, 255, 255, 0.12);
    --fg: #f1f5f9;
    --fg-2: #e2e8f0;
    --muted: #cbd5e1;
    --dim: #94a3b8;
    --accent: #5b8def;
    --accent-2: #7aa2f7;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1b2233 0%, var(--bg) 60%);
    color: var(--fg);
    font: 14px/1.6 "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 26px 30px 40px;
  }
  h1 { font-size: 19px; font-weight: 500; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    backdrop-filter: blur(40px) saturate(1.8);
    -webkit-backdrop-filter: blur(40px) saturate(1.8);
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 14px; font-weight: 500; margin: 0 0 14px;
    color: var(--fg-2); display: flex; align-items: center; gap: 8px;
  }
  .card h2::before {
    content: ""; width: 3px; height: 13px; border-radius: 2px;
    background: var(--accent);
  }

  .accts { display: flex; gap: 12px; flex-wrap: wrap; }
  .acct {
    flex: 1 1 210px; display: flex; align-items: center; gap: 11px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 15px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(74,222,128,.6); }
  .dot.off { background: var(--err); }
  .acct-name { font-size: 13px; font-weight: 500; }
  .acct-meta { font-size: 11.5px; color: var(--dim); margin-top: 2px; }

  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
  textarea, input[type=text] {
    width: 100%; background: rgba(15, 18, 24, 0.75);
    border: 1px solid var(--border); border-radius: 9px;
    color: var(--fg); padding: 12px 13px; font: inherit; font-size: 13px;
    resize: vertical; outline: none; transition: border-color .15s;
  }
  textarea { min-height: 88px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  textarea:focus, input[type=text]:focus { border-color: var(--accent); }
  ::placeholder { color: var(--dim); opacity: 1; }

  .row { margin-bottom: 16px; }
  .picker { display: flex; gap: 10px; }
  .pick {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 15px; cursor: pointer;
    transition: all .15s; display: flex; align-items: center; gap: 10px;
  }
  .pick:hover { border-color: rgba(255,255,255,.24); }
  .pick.sel { border-color: var(--accent); background: rgba(91,141,239,.13); }
  .pick.dis { opacity: .4; cursor: not-allowed; }
  .pick .box {
    width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--dim);
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: transparent;
  }
  .pick.sel .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pick-t { font-size: 13px; font-weight: 500; }
  .pick-s { font-size: 11.5px; color: var(--dim); }

  .opts { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .chk input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

  button {
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 11px 26px; font: inherit; font-size: 13.5px; font-weight: 500;
    cursor: pointer; transition: all .15s;
  }
  button:hover:not(:disabled) { background: var(--accent-2); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  button.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--fg); }

  .actions { display: flex; gap: 11px; align-items: center; margin-top: 4px; }

  .prog { margin-top: 16px; display: none; }
  .prog.on { display: block; }
  .bar { height: 7px; background: rgba(255,255,255,.09); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .bar.indet > i { width: 35%; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }
  .stat { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 9px; }

  .steps { margin-top: 15px; display: flex; flex-direction: column; gap: 2px; }
  .step {
    display: flex; align-items: center; gap: 10px; padding: 7px 11px;
    border-radius: 7px; font-size: 12.5px; color: var(--dim);
  }
  .step.act { background: rgba(91,141,239,.11); color: var(--fg-2); }
  .step.ok { color: var(--ok); }
  .step .ic {
    width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid currentColor;
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 9.5px;
  }
  .step.ok .ic { background: var(--ok); border-color: var(--ok); color: #0f1115; }
  .step.act .ic { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step small { margin-left: auto; font-size: 11.5px; opacity: .75; }

  .files { margin-top: 14px; max-height: 210px; overflow: auto; border-radius: 9px; border: 1px solid var(--border); }
  .frow {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    font-size: 12.5px; border-bottom: 1px solid rgba(255,255,255,.055);
  }
  .frow:last-child { border-bottom: none; }
  .frow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .sz { color: var(--dim); font-size: 11.5px; flex: 0 0 auto; }
  .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 4px; flex: 0 0 auto; }
  .tag.pending { background: rgba(148,163,184,.16); color: var(--dim); }
  .tag.downloaded { background: rgba(91,141,239,.18); color: var(--accent-2); }
  .tag.uploaded { background: rgba(74,222,128,.16); color: var(--ok); }
  .tag.fail { background: rgba(248,113,113,.16); color: var(--err); }

  .msg { margin-top: 14px; padding: 11px 14px; border-radius: 9px; font-size: 12.5px; display: none; }
  .msg.on { display: block; }
  .msg.err { background: rgba(248,113,113,.11); border: 1px solid rgba(248,113,113,.32); color: #fca5a5; }
  .msg.ok { background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.3); color: #86efac; }
  .msg.info { background: rgba(91,141,239,.1); border: 1px solid rgba(91,141,239,.3); color: #93c5fd; }

  .muted { color: var(--dim); font-size: 12px; }
  .hint { font-size: 11.5px; color: var(--dim); margin-top: 7px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<h1>网盘跨盘转存</h1>
<div class="sub">贴一个网盘分享链接 → 自动下载到本地 → 自动上传到目标网盘</div>

<div class="card">
  <h2>账号状态</h2>
  <div class="accts" id="accts">
    <div class="acct"><span class="dot"></span><div><div class="acct-name">检测中…</div></div></div>
  </div>
</div>

<div class="card">
  <h2>① 分享链接</h2>
  <div class="row">
    <textarea id="link" placeholder="粘贴百度网盘或夸克网盘的分享链接（带提取码一起粘也行，会自动识别）&#10;&#10;例：https://pan.baidu.com/s/1xxxxx?pwd=abcd&#10;例：https://pan.quark.cn/s/xxxxx 提取码：abcd"></textarea>
    <div class="hint" id="detect"></div>
  </div>
</div>

<div class="card">
  <h2>② 目标网盘</h2>
  <div class="picker" id="picker">
    <div class="pick sel" data-p="quark"><span class="box">✓</span><div><div class="pick-t">夸克网盘</div><div class="pick-s">官方 Skill 直传</div></div></div>
    <div class="pick" data-p="baidu"><span class="box">✓</span><div><div class="pick-t">百度网盘</div><div class="pick-s">开放平台 API</div></div></div>
    <div class="pick dis" data-p="xunlei"><span class="box">✓</span><div><div class="pick-t">迅雷网盘</div><div class="pick-s">暂不支持</div></div></div>
  </div>
  <div class="row" style="margin-top:16px">
    <label>目标目录</label>
    <input type="text" id="dstPath" value="/夸克中转文件夹" />
    <div class="hint">文件会先落到你自己网盘的「中转文件夹」，再从这里下载上传。目录不存在会自动创建。</div>
  </div>
  <div class="opts">
    <label class="chk"><input type="checkbox" id="keepLocal" /> 保留本地临时文件（默认传完自动删）</label>
  </div>
</div>

<div class="card">
  <h2>③ 开始转存</h2>
  <div class="actions">
    <button id="go">开始转存</button>
    <button id="clear" class="ghost">清空</button>
    <span class="muted" id="tmpdir"></span>
  </div>

  <div class="prog" id="prog">
    <div class="bar" id="bar"><i></i></div>
    <div class="stat"><span id="phase">准备中…</span><span id="pct"></span></div>
    <div class="steps" id="steps"></div>
    <div class="files" id="files" style="display:none"></div>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const PHASES = [
    ["resolve",  "解析链接"],
    ["save",     "收进自己网盘"],
    ["probe",    "列出文件"],
    ["download", "下载到本地"],
    ["upload",   "上传到目标网盘"],
    ["verify",   "校验"],
    ["cleanup",  "清理临时文件"],
  ];
  let dstProvider = "quark";
  let timer = null;

  const DEFAULTS = { quark: "/夸克中转文件夹", baidu: "/百度中转文件夹" };

  function fmtSize(n) {
    if (!n) return "0 B";
    const u = ["B", "KB", "MB", "GB", "TB"];
    let i = 0, v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return v.toFixed(v < 10 && i > 0 ? 2 : 1) + " " + u[i];
  }

  function showMsg(text, kind) {
    const m = $("msg");
    m.className = "msg on " + (kind || "info");
    m.textContent = text;
  }
  function hideMsg() { $("msg").className = "msg"; }

  // ── 账号状态 ──
  async function loadStatus() {
    const box = $("accts");
    try {
      const r = await fetch("/api/status");
      const s = await r.json();
      const rows = [];

      rows.push(mkAcct(
        "百度网盘",
        s.baidu.ok,
        s.baidu.ok
          ? (s.baidu.name || "已连接") + (s.baidu.vip ? " · 超级会员" : "")
          : (s.baidu.reason || "未连接"),
      ));
      rows.push(mkAcct(
        "夸克网盘",
        s.quark.ok,
        s.quark.ok ? (s.quark.name || "已连接") : (s.quark.reason || "未连接"),
      ));
      rows.push(mkAcct("迅雷网盘", false, "暂不支持（无官方开放平台）"));

      box.innerHTML = rows.join("");
      if (s.tmpDir) $("tmpdir").textContent = "中转目录 " + s.tmpDir;

      // 目标网盘的可用性直接反映到选择器
      document.querySelectorAll(".pick").forEach((el) => {
        const p = el.dataset.p;
        const ok = p === "baidu" ? s.baidu.ok : p === "quark" ? s.quark.ok : false;
        el.classList.toggle("dis", !ok);
        if (!ok) el.classList.remove("sel");
      });
    } catch (e) {
      box.innerHTML = '<div class="acct"><span class="dot off"></span><div><div class="acct-name">无法读取状态</div><div class="acct-meta">' + e.message + "</div></div></div>";
    }
  }

  function mkAcct(name, ok, meta) {
    return '<div class="acct"><span class="dot ' + (ok ? "on" : "off") + '"></span><div>'
      + '<div class="acct-name">' + esc(name) + "</div>"
      + '<div class="acct-meta">' + esc(meta) + "</div></div></div>";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ── 链接识别 ──
  function detect(link) {
    const s = (link || "").trim();
    if (!s) return null;
    if (/pan\.baidu\.com|baidu\.com\/s\//i.test(s)) return "baidu";
    if (/pan\.quark\.cn|quark\.cn\/s\//i.test(s)) return "quark";
    if (/xunlei\.com/i.test(s)) return "xunlei";
    return null;
  }

  $("link").addEventListener("input", () => {
    const p = detect($("link").value);
    const d = $("detect");
    if (!p) { d.textContent = ""; return; }
    if (p === "xunlei") { d.innerHTML = '<span style="color:var(--warn)">识别到迅雷链接 —— 本版本暂不支持</span>'; return; }
    const name = p === "baidu" ? "百度网盘" : "夸克网盘";
    d.innerHTML = '<span style="color:var(--ok)">识别为 ' + name + " 分享</span>";
  });

  // ── 目标网盘选择 ──
  $("picker").addEventListener("click", (e) => {
    const el = e.target.closest(".pick");
    if (!el || el.classList.contains("dis")) return;
    document.querySelectorAll(".pick").forEach((x) => x.classList.remove("sel"));
    el.classList.add("sel");
    dstProvider = el.dataset.p;
    $("dstPath").value = DEFAULTS[dstProvider] || "";
  });

  // ── 步骤渲染 ──
  function renderSteps(cur, status) {
    const idx = PHASES.findIndex((p) => p[0] === cur);
    $("steps").innerHTML = PHASES.map((p, i) => {
      let cls = "";
      if (status === "done") cls = "ok";
      else if (status === "error" && p[0] === cur) cls = "act";
      else if (i < idx) cls = "ok";
      else if (i === idx) cls = "act";
      const mark = cls === "ok" ? "✓" : "";
      return '<div class="step ' + cls + '"><span class="ic">' + mark + "</span>" + p[1] + "</div>";
    }).join("");
  }

  // ── 轮询任务 ──
  function poll(id) {
    clearInterval(timer);
    timer = setInterval(async () => {
      try {
        const r = await fetch("/api/xfer?id=" + encodeURIComponent(id));
        const t = await r.json();
        render(t);
        if (t.status === "done" || t.status === "error") {
          clearInterval(timer);
          timer = null;
          $("go").disabled = false;
        }
      } catch (e) {
        // 单次失败不打断，等下一次
      }
    }, 900);
  }

  function render(t) {
    $("prog").classList.add("on");
    renderSteps(t.phase, t.status);

    const total = t.totalBytes || 0;
    const done = t.doneBytes || 0;
    const pct = total ? Math.min(100, (done / total) * 100) : 0;

    const bar = $("bar");
    if (!total || t.phase === "save" || t.phase === "resolve" || t.phase === "probe") {
      bar.classList.add("indet");
      $("pct").textContent = "";
    } else {
      bar.classList.remove("indet");
      bar.firstElementChild.style.width = pct.toFixed(1) + "%";
      $("pct").textContent = pct.toFixed(0) + "% · " + fmtSize(done) + " / " + fmtSize(total);
    }

    $("phase").textContent = t.message || t.phase;

    if (t.items && t.items.length) {
      const box = $("files");
      box.style.display = "block";
      box.innerHTML = t.items.map((f) => {
        const cls = f.verify === "missing" || f.verify === "size-mismatch" ? "fail" : (f.status || "pending");
        const tagText = cls === "pending" ? "待处理" : cls === "downloaded" ? "已下载"
          : cls === "uploaded" ? (f.instant ? "已上传·秒传" : "已上传") : "异常";
        return '<div class="frow"><span class="nm">' + esc(f.name) + '</span>'
          + (f.size ? '<span class="sz">' + fmtSize(f.size) + "</span>" : "")
          + '<span class="tag ' + cls + '">' + tagText + "</span></div>";
      }).join("");
    }

    if (t.status === "error") showMsg("失败：" + (t.error || t.message), "err");
  }

  // ── 开始 ──
  $("go").addEventListener("click", async () => {
    const link = $("link").value.trim();
    if (!link) return showMsg("请先粘贴分享链接", "err");

    const src = detect(link);
    if (src === "xunlei") return showMsg("迅雷暂不支持，请换百度或夸克链接", "err");
    if (!src) return showMsg("无法识别的链接，请检查是否为百度/夸克分享链接", "err");
    if (src === dstProvider) {
      return showMsg("来源和目标都是" + (src === "baidu" ? "百度" : "夸克") + "，无需跨盘转存。如需站内转存请用「网盘转存中转」。", "err");
    }

    const sel = document.querySelector(".pick.sel");
    if (!sel || sel.classList.contains("dis")) return showMsg("请选择一个可用的目标网盘", "err");

    hideMsg();
    $("go").disabled = true;
    $("files").style.display = "none";
    $("files").innerHTML = "";
    renderSteps("resolve", "running");

    try {
      const r = await fetch("/api/xfer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          link,
          dstProvider,
          dstPath: $("dstPath").value.trim() || DEFAULTS[dstProvider],
          keepLocal: $("keepLocal").checked,
        }),
      });
      const t = await r.json();
      if (!r.ok) throw new Error(t.error || "启动失败");
      $("prog").classList.add("on");
      showMsg("任务已启动，正在处理…", "info");
      poll(t.id);
    } catch (e) {
      $("go").disabled = false;
      showMsg("启动失败：" + e.message, "err");
    }
  });

  $("clear").addEventListener("click", () => {
    clearInterval(timer);
    timer = null;
    $("link").value = "";
    $("keepLocal").checked = false;
    $("prog").classList.remove("on");
    $("files").innerHTML = "";
    $("files").style.display = "none";
    $("steps").innerHTML = "";
    $("detect").textContent = "";
    hideMsg();
    $("go").disabled = false;
  });

  loadStatus();
  setInterval(loadStatus, 30000);
})();
</script>
</body>
</html>
