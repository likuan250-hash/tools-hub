<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多维表智能录入</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text); min-height: 100vh;
      background:
        radial-gradient(900px 700px at 80% 20%, var(--bg-2), transparent 55%),
        radial-gradient(1000px 650px at 15% 75%, var(--bg-3), transparent 58%),
        radial-gradient(800px 500px at 110% 90%, var(--bg-2), transparent 50%),
        radial-gradient(700px 400px at 50% 55%, rgba(255,255,255,0.04), transparent 48%),
        linear-gradient(155deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      padding: 32px 16px 64px;
      transition: background 0.5s ease, color 0.3s ease;
    }
    .wrap { max-width: 960px; margin: 0 auto; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; font-size: 22px;
      box-shadow: 0 8px 30px rgba(var(--accent-rgb), 0.4);
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .theme-btn {
      border: 1px solid var(--glass-border); background: var(--glass-bg);
      color: var(--text); border-radius: 12px; padding: 8px 14px;
      cursor: pointer; font-size: 13px; backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .theme-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }
    .ver-badge {
      border: 1px solid var(--glass-border); background: var(--glass-bg);
      color: var(--text-dim); border-radius: 12px; padding: 8px 14px;
      cursor: pointer; font-size: 13px; backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      font-family: "Cascadia Code", "JetBrains Mono", monospace; white-space: nowrap;
    }
    .ver-badge:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }
    .ver-badge.latest { color: var(--ok); }
    .ver-badge.checking { color: var(--accent-2); }
    .ver-badge.has-update {
      color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent; box-shadow: 0 6px 20px rgba(var(--accent-rgb),0.4);
      animation: badgePulse 1.6s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 6px 20px rgba(var(--accent-rgb),0.4); }
      50% { box-shadow: 0 6px 28px rgba(var(--accent2-rgb),0.65); }
    }

    .status-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .chip {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      border: 1px solid var(--glass-border); border-radius: 14px;
      background: var(--glass-bg); backdrop-filter: blur(22px) saturate(160%);
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.10);
      font-size: 13px; color: var(--text-dim);
    }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .chip .dot.green { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .chip .dot.yellow { background: var(--warn); }
    .chip .dot.red { background: var(--err); }

    .panel {
      border: 1px solid var(--glass-border); border-radius: 22px;
      background: var(--glass-bg); backdrop-filter: blur(24px) saturate(160%);
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.10);
      padding: 26px; margin-bottom: 22px;
    }
    .panel h2 {
      font-size: 17px; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px; letter-spacing: 0.2px;
    }
    .panel h2::before {
      content: ""; display: inline-block; width: 6px; height: 18px;
      border-radius: 4px; background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    /* 控件实色背景：明暗两态，避免 glass 套 glass */
    :root { --field-bg: var(--bg-2); --solid-bg: var(--bg-2); }
    [data-theme="light"] { --field-bg: #eef1fb; --solid-bg: #e7ecf8; }
    input[type="text"], textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--glass-border); background: var(--field-bg);
      color: var(--text); font-size: 14px; outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    textarea { min-height: 150px; padding: 14px; font-family: "Cascadia Code", "JetBrains Mono", "PingFang SC", monospace; line-height: 1.7; resize: vertical; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.25); }
    textarea::placeholder { color: var(--text-dim); opacity: 0.75; }

    .input-wrap { position: relative; }
    .clear-corner {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      width: auto; padding: 5px 12px; font-size: 12px;
      border-radius: 10px; cursor: pointer;
      border: 1px solid var(--glass-border); background: var(--field-bg);
      color: var(--text-dim); backdrop-filter: blur(12px);
      opacity: 0.75; transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease;
    }
    .clear-corner:hover { opacity: 1; color: var(--text); background: var(--solid-bg); }

    .input-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: center; margin-top: 14px; }
    .input-row label { margin: 0; white-space: nowrap; }
    .input-row .browse { white-space: nowrap; }

    .field { margin-top: 14px; }
    .hint { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.6; padding-left: 10px; border-left: 2px solid var(--glass-border); }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
      font-size: 15px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(var(--accent-rgb), 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(var(--accent-rgb), 0.5); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn.ghost { background: var(--field-bg); border: 1px solid var(--glass-border); color: var(--text); box-shadow: var(--shadow-card); }

    .toolbar { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
    .toolbar .btn { width: auto; padding: 11px 20px; font-size: 14px; }

    .preview-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 14px; line-height: 2.1; }
    .preview-grid .label { color: var(--text-dim); white-space: nowrap; }
    .preview-grid .value { color: var(--text); word-break: break-all; }
    .preview-grid .tag { display: inline-block; padding: 1px 9px; background: rgba(var(--accent-rgb),0.18); color: var(--accent-3); border-radius: 6px; font-size: 12px; margin: 2px 3px; }

    .auto-result { display: none; }
    .auto-result.show { display: block; }
    .step-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--glass-border); font-size: 14px; }
    .step-item:last-child { border-bottom: none; }
    .step-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
    .step-body { flex: 1; }
    .step-name { font-weight: 500; }
    .step-detail { color: var(--text-dim); font-size: 13px; margin-top: 1px; word-break: break-all; }
    .step-detail .ok { color: var(--ok); }
    .step-detail .err { color: var(--err); }
    .result-summary { text-align: center; padding: 14px; margin-top: 10px; font-size: 16px; font-weight: 600; }
    .result-summary.ok { color: var(--ok); }
    .result-summary.fail { color: var(--err); }

    .log-area { margin-top: 10px; padding: 10px 14px; background: var(--field-bg); border: 1px solid var(--glass-border); border-radius: 12px; font-family: monospace; font-size: 13px; line-height: 1.6; max-height: 260px; overflow-y: auto; color: var(--text-dim); }
    .log-area .line { padding: 1px 0; }
    .log-area .line.info { color: var(--text-dim); }
    .log-area .line.ok { color: var(--ok); }
    .log-area .line.err { color: var(--err); }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: #fff; padding: 10px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }

    /* ── 重复确认 modal ── */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 1000; }
    .modal { width: min(480px, 92vw); border: 1px solid var(--glass-border); border-radius: 20px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(160%); padding: 26px; box-shadow: 0 24px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255, 255, 255, 0.10); }
    .modal-title { font-size: 17px; margin-bottom: 14px; font-weight: 600; }
    .modal-body { font-size: 13px; color: var(--text-dim); line-height: 1.7; margin-bottom: 6px; word-break: break-all; }
    .modal-body .lk { display: inline-block; margin: 4px 4px 0 0; padding: 2px 8px; border-radius: 6px; background: rgba(var(--accent-rgb),0.15); color: var(--accent-3); font-size: 12px; word-break: break-all; }
    .modal-check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; margin: 14px 0 4px; cursor: pointer; color: var(--text); }
    .modal-check input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
    .modal-actions .btn { flex: 1; padding: 12px; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--text-dim); border-top-color: var(--accent-2); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }

    @media (max-width: 680px) { .input-row { grid-template-columns: 1fr; } .input-row .browse { justify-self: start; } }
    /* 亮色玻璃分离增强：顶部白高光 + 底部暗线（白底上原 0.10 白高光不可见，靠加深边框 + 此暗线承担分离） */
    [data-theme="light"] .panel,
    [data-theme="light"] .chip,
    [data-theme="light"] .card,
    [data-theme="light"] .modal {
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 0 rgba(20, 30, 80, 0.10);
    }
    /* 实色回退：老设备/部分 webview 不支持 backdrop-filter 时玻璃失效，用实色卡片 + 正常深边框保证可读 */
    @supports not (backdrop-filter: blur(1px)) {
      .panel, .chip, .card, .modal, .theme-btn, .ver-badge, .tab {
        -webkit-backdrop-filter: none; backdrop-filter: none;
        background: #eef1fb; border: 1px solid rgba(90, 95, 150, 0.45);
      }
    }
  </style>
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/macos-motion.css" />
  <link rel="stylesheet" href="/macos.css" />
</head>
<body>
<div class="wrap">

  <header>
      <div class="brand">
        <div class="logo">📊</div>
      <div>
        <h1>多维表智能录入</h1>
        <div class="sub">粘贴游戏信息 → 自动解析 → 🤖 AI 介绍 + 🖼️ 封面 + 📋 多维表</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="ver-badge" id="verBadge" title="由工具箱统一管理">v?</button>
      <button class="theme-btn" id="kdocsBtn" title="在浏览器打开金山文档多维表">📄 金山文档</button>
      <button class="theme-btn" id="themeBtn">🌗 主题</button>
    </div>
  </header>

  <div class="status-row">
    <div class="chip" id="chipKdocs"><span class="dot yellow"></span> kdocs: 检测中...</div>
    <div class="chip" id="chipBl"><span class="dot yellow"></span> AI: 检测中...</div>
  </div>

  <div class="panel">
    <h2>📝 游戏信息</h2>
    <div class="hint" style="margin-bottom:14px">粘贴第一行「游戏名称 + 描述 + 标签」，后续行各网盘链接。非 Steam 游戏请务必在下方填写「封面链接」，否则不会生成宣传图。</div>
    <label>游戏信息文本</label>
    <div class="input-wrap">
      <textarea id="gameInput" placeholder="第一行：游戏名称 + 描述 + 标签&#10;后续行：各网盘链接&#10;可选：封面链接 https://..."></textarea>
      <button class="clear-corner" id="clearBtn">🗑️ 清空</button>
    </div>

    <div class="input-row">
      <label>📁 封面目录</label>
      <input type="text" id="coverDir" value="E:\游戏网站建设" placeholder="封面图片存放路径" />
      <button class="btn ghost browse" id="browseDirBtn" style="padding:10px 16px;font-size:13px;">📂 选择</button>
    </div>
    <div class="input-row">
      <label>🖼️ 封面链接</label>
      <input type="text" id="coverUrl" placeholder="非 Steam 游戏填图片 URL（.jpg/.png）" />
      <span></span>
    </div>

    <div class="toolbar">
      <button class="btn" id="autoBtn">🤖 一键执行</button>
    </div>
  </div>

  <div class="panel" id="preview" style="display:none;">
    <h2>🔍 解析预览</h2>
    <div class="preview-grid" id="previewContent"></div>
  </div>

  <div class="panel auto-result" id="autoResult">
    <h2>⚙️ 执行进度</h2>
    <div id="autoSteps"></div>
    <div class="result-summary" id="autoSummary"></div>
    <button class="btn ghost" id="kdocsViewBtn" style="display:none;margin-top:12px;">🔗 在金山文档查看</button>
    <div class="log-area" id="autoLog"></div>
  </div>

</div>

<!-- 重复确认 modal -->
<div class="modal-mask" id="dupMask" style="display:none;">
  <div class="modal">
    <h3 class="modal-title" id="dupTitle">已存在</h3>
    <div class="modal-body" id="dupBody"></div>
    <label class="modal-check"><input type="checkbox" id="chkForceAdd" /> 强制新增（忽略重复，新建一条记录）</label>
    <label class="modal-check"><input type="checkbox" id="chkUpdateLinks" /> 更新网盘链接（仅更新该记录的网盘链接，不新建）</label>
    <div class="modal-actions">
      <button class="btn ghost" id="dupCancel">取消</button>
      <button class="btn" id="dupContinue">继续</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
