<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>待发布清单</title>
<style>
:root{
  --bg:#070b16; --panel:#0d1424; --line:rgba(0,240,255,.30);
  --cyan:#00f0ff; --pink:#ff2ec4; --text:#fff; --dim:#9fb8cc;
  --ok:#34d399;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
body{
  font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--text);
  background:radial-gradient(700px 400px at 80% -10%,rgba(0,240,255,.16),transparent 60%),
             radial-gradient(700px 500px at 0% 110%,rgba(255,46,196,.14),transparent 55%),var(--bg);
  min-height:100vh;display:flex;flex-direction:column;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex:none}
h1{flex:1;font-size:19px;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(0,240,255,.08);color:var(--text);font-size:18px;line-height:1}
.hbtn.act{width:auto;padding:0 12px;font-size:13px;font-weight:600}
#sync{font-size:12px;color:var(--dim);margin-bottom:10px;flex:none}
#sync.ok{color:var(--ok)} #sync.err{color:#ff6688}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex:none}
.tabs button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:rgba(0,240,255,.08);color:var(--dim);font-size:14px;font-weight:600}
.tabs button.active{background:linear-gradient(135deg,var(--cyan),var(--pink));color:#06101a;border-color:transparent}
.item{
  display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;margin-bottom:9px;
  background:linear-gradient(180deg,rgba(0,240,255,.10),rgba(0,240,255,.05));border:1px solid var(--line);
}
.items{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:96px}
.item .main{flex:1;min-width:0}
.item .nm{font-size:15px;line-height:1.45;word-break:break-all}
.item .dt{font-size:12px;color:var(--dim);margin-top:3px}
.item.done .nm{text-decoration:line-through;opacity:.7}
.item .ops{display:flex;align-items:center;gap:10px}
.ck{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim)}
.ck input{width:19px;height:19px;accent-color:var(--cyan)}
.del{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,102,136,.5);background:transparent;color:#ff6688;font-size:15px}
.rep{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:12px;padding:8px 10px;border-radius:10px}
.rep:active{color:#fff;border-color:var(--pink)}
.empty{padding:44px 10px;text-align:center;color:var(--dim);font-size:13px}
.fab{
  position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;
  border-radius:50%;border:none;font-size:26px;color:#06101a;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  box-shadow:0 8px 24px rgba(0,240,255,.35),0 0 18px rgba(255,46,196,.25);
  z-index:5;
}
.fab:active{transform:scale(.94)}
.mask{
  position:fixed;inset:0;background:rgba(3,5,12,.66);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;z-index:10;
}
.mask.show{display:flex}
.sheet{
  width:100%;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#0d1424,#0a101e);border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
  animation:up .28s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.sheet h2 button{border:none;background:none;color:var(--dim);font-size:18px;padding:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.field input{
  width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
  background:rgba(0,240,255,.07);color:var(--text);font-size:15px;
}
.field input::placeholder{color:#6f8aa0}
.field select{
  width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
  background:rgba(0,240,255,.07);color:var(--text);font-size:15px;-webkit-appearance:none;appearance:none;
}
.clash{display:none;color:#ff6688;font-size:12px;margin:-4px 0 10px}
.chk-row{display:flex;gap:18px;margin:4px 0 16px;font-size:14px;color:var(--text)}
.chk-row input{width:18px;height:18px;accent-color:var(--cyan)}
.btn{
  width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;color:#06101a;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
}
.btn.ghost{margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--dim)}
#toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  padding:10px 18px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;display:none;z-index:20;white-space:nowrap;
}
#toast.show{display:block}
</style>
</head>
<body>
  <header>
    <h1>待发布清单</h1>
    <button class="hbtn act" onclick="load()" title="从云端拉取">同步</button>
    <button class="hbtn act" onclick="upload()" title="上传到云端">上传</button>
    <button class="hbtn" onclick="openCfg()" title="配置">⚙</button>
  </header>
  <div id="sync"></div>
  <div class="tabs">
    <button id="tabTodo" class="active" onclick="tab('todo')">待完成</button>
    <button id="tabDone" onclick="tab('done')">已完成</button>
  </div>
  <div id="list" class="items"></div>

  <button class="fab" onclick="openAdd()">＋</button>

  <div class="mask" id="addMask">
    <div class="sheet">
      <h2><span id="addTitle">添加视频</span><span><button onclick="closeMask('addMask')">×</button></span></h2>
      <div class="field"><label>视频名称</label><input id="nm" placeholder="如：零.红蝶.重制版"></div>
      <div class="field"><label>待发布日期（可选）</label><input type="date" id="dt"></div>
      <div class="chk-row"><label><input type="checkbox" id="hasRes"> 有资源</label></div>
      <button class="btn" onclick="addItem()"><span id="addBtnLabel">确定添加</span></button>
    </div>
  </div>

  <div class="mask" id="cfgMask">
    <div class="sheet">
      <h2>云端配置<span><button onclick="closeMask('cfgMask')">×</button></span></h2>
      <div class="field"><label>GitHub Token（建议只授权清单仓库）</label><input type="password" id="token" placeholder="ghp_… 或 github_pat_…" autocomplete="off"></div>
      <button class="btn" onclick="saveToken()">保存并连接</button>
    </div>
  </div>

  <div class="mask" id="repMask">
    <div class="sheet">
      <h2>顶替发布<span><button onclick="closeMask('repMask')">✕</button></span></h2>
      <div class="field"><label>顶替者</label><input id="repMover" readonly></div>
      <div class="field"><label>顶替哪一天（被顶替者）</label><select id="repTarget"></select></div>
      <div class="field"><label>被顶替者重排到（新日期）</label><input type="date" id="repDate"></div>
      <div class="clash" id="repClash"></div>
      <button class="btn" onclick="doRep()">确认顶替</button>
      <button class="btn ghost" onclick="closeMask('repMask')">取消</button>
    </div>
  </div>

  <div id="toast"></div>
<script>
const REPO = 'likuan250-hash/pending-videos-data';
const PATH = 'pending_videos.json';
const KEY = 'pv_token';
let token = localStorage.getItem(KEY) || '';
let list = [];
let curTab = 'todo';

const $ = (s) => document.querySelector(s);
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = err ? 'rgba(255,102,136,.6)' : 'var(--line)';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function b64enc(s) { return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(s))); }
function b64dec(b) { return new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))); }

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: {
      Authorization: 'Bearer ' + token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.status === 204 ? null : res.json();
}
const url = () => 'https://api.github.com/repos/' + REPO + '/contents/' + PATH;

function openMask(id) { $('#' + id).classList.add('show'); }
function closeMask(id) { $('#' + id).classList.remove('show'); }
let editId = null;
function resetAddForm() {
  editId = null;
  $('#addTitle').textContent = '添加视频';
  $('#addBtnLabel').textContent = '确定添加';
}
function openAdd() {
  resetAddForm();
  $('#nm').value = ''; $('#dt').value = ''; $('#hasRes').checked = false;
  openMask('addMask');
}
function openEdit(id) {
  const it = list.find(x => x.id === id);
  if (!it) return;
  editId = id;
  $('#addTitle').textContent = '编辑视频';
  $('#addBtnLabel').textContent = '保存修改';
  $('#nm').value = it.name || '';
  $('#dt').value = it.publishDate || '';
  $('#hasRes').checked = !!it.hasResource;
  openMask('addMask');
}
function openCfg() { $('#token').value = ''; openMask('cfgMask'); }

async function saveToken() {
  token = $('#token').value.trim();
  if (!token) return toast('请输入 token', true);
  localStorage.setItem(KEY, token);
  closeMask('cfgMask');
  await load();
}

async function upload() {
  if (!token) return toast('请先配置 token', true);
  const s = $('#sync');
  s.textContent = '上传中…'; s.className = '';
  try {
    await save(list);
    s.textContent = '已上传'; s.className = 'ok';
    toast('已上传');
  } catch (_) {
    s.textContent = '上传失败'; s.className = 'err';
  }
}

async function load() {
  if (!token) { $('#sync').textContent = '未配置，点右上 ⚙ 设置'; $('#sync').className = 'err'; return; }
  const s = $('#sync');
  s.textContent = '同步中…'; s.className = '';
  try {
    const d = await api('GET', url());
    list = JSON.parse(b64dec(d.content));
    if (!Array.isArray(list)) list = [];
    s.textContent = '已同步 ' + list.length + ' 条'; s.className = 'ok';
    render();
  } catch (e) {
    s.textContent = '加载失败：' + e.message; s.className = 'err';
  }
}

async function save(next) {
  try {
    const d = await api('GET', url());
    await api('PUT', url(), {
      message: 'mobile sync',
      content: b64enc(JSON.stringify(next, null, 2)),
      sha: d.sha,
    });
    list = next;
    render();
    $('#sync').textContent = '已保存'; $('#sync').className = 'ok';
  } catch (e) {
    // 云端已被其他端更新（sha 过期）→ 重新拉取合并后重试一次
    try {
      const d2 = await api('GET', url());
      const remote = JSON.parse(atob(d2.content));
      const merged = mergeLists(next, remote);
      await api('PUT', url(), {
        message: 'mobile sync (merged)',
        content: b64enc(JSON.stringify(merged, null, 2)),
        sha: d2.sha,
      });
      list = merged;
      render();
      $('#sync').textContent = '已保存（合并云端）'; $('#sync').className = 'ok';
      toast('已保存并合并另一端的改动');
    } catch (e2) {
      toast('保存失败：' + e2.message, true);
      throw e2;
    }
  }
}

// 按 id 对齐、updatedAt 较新者胜（与电脑端 mergeLists 同规则）
function mergeLists(local, remote) {
  const map = {};
  for (const x of remote) map[x.id] = x;
  for (const x of local) {
    const r = map[x.id];
    const t = (x.updatedAt || x.createdAt || 0);
    if (!r || t >= (r.updatedAt || r.createdAt || 0)) map[x.id] = x;
  }
  return Object.values(map);
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function render() {
  const done = list.filter(x => x.hasResource && x.published);
  const todo = list.filter(x => !(x.hasResource && x.published));
  const byDate = (a, b) => {
    const x = (a.publishDate || '9999-99-99'), y = (b.publishDate || '9999-99-99');
    if (x !== y) return x < y ? -1 : 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  };
  const show = (curTab === 'done' ? done : todo).slice().sort(byDate);
  $('#list').innerHTML = show.length
    ? show.map(x => '<div class="item' + (x.hasResource && x.published ? ' done' : '') + '">' +
        '<div class="main"><div class="nm">' + esc(x.name) + '</div>' +
        '<div class="dt">' + (x.publishDate ? esc(x.publishDate) : '未定') + '</div></div>' +
        '<div class="ops">' +
        '<label class="ck"><input type="checkbox" data-id="' + x.id + '" data-k="hasResource"' + (x.hasResource ? ' checked' : '') + '>资源</label>' +
        '<label class="ck"><input type="checkbox" data-id="' + x.id + '" data-k="published"' + (x.published ? ' checked' : '') + '>发布</label>' +
        '<button class="rep" data-edit="' + x.id + '">编辑</button>' +
        (curTab === 'todo' ? '<button class="rep" data-rep="' + x.id + '">顶替</button>' : '') +
        '<button class="del" data-del="' + x.id + '">×</button>' +
        '</div></div>').join('')
    : '<div class="empty">暂无' + (curTab === 'done' ? '已完成' : '待完成') + '记录</div>';
}
function tab(t) { curTab = t; $('#tabTodo').classList.toggle('active', t === 'todo'); $('#tabDone').classList.toggle('active', t === 'done'); render(); }

async function addItem() {
  const nm = $('#nm').value.trim();
  if (!nm) return toast('请输入名称', true);
  if (list.some(x => x.id !== editId && x.name === nm)) return toast('已存在同名记录', true);
  const wasEdit = editId;
  if (editId) {
    const it = list.find(x => x.id === editId);
    if (!it) return toast('记录不存在', true);
    it.name = nm;
    it.publishDate = $('#dt').value || '';
    it.hasResource = $('#hasRes').checked;
    it.updatedAt = Date.now();
  } else {
    const item = {
    id: 'pv' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: nm,
    publishDate: $('#dt').value || '',
    hasResource: $('#hasRes').checked,
    published: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    };
    list.push(item);
  }
  $('#nm').value = ''; $('#dt').value = ''; $('#hasRes').checked = false;
  closeMask('addMask');
  resetAddForm();
  await save(list);
  toast(wasEdit ? '已保存' : '已添加');
}

$('#list').addEventListener('change', async (e) => {
  const cb = e.target;
  if (!cb.dataset.id) return;
  const item = list.find(x => x.id === cb.dataset.id);
  if (!item) return;
  item[cb.dataset.k] = cb.checked;
  item.updatedAt = Date.now();
  await save(list);
});

$('#list').addEventListener('click', async (e) => {
  const ed = e.target.closest('[data-edit]');
  if (ed) { openEdit(ed.dataset.edit); return; }
  const r = e.target.closest('[data-rep]');
  if (r) { openRep(r.dataset.rep); return; }
  const b = e.target.closest('[data-del]');
  if (!b) return;
  list = list.filter(x => x.id !== b.dataset.del);
  await save(list);
  toast('已删除');
});

// ── 顶替发布：mover 占 target 的日期，target 重排新日期（冲突即时拦截）──
let repMoverId = null;
function openRep(id) {
  repMoverId = id;
  const mover = list.find(x => x.id === id);
  $('#repMover').value = mover ? mover.name : '';
  const cands = list.filter(x => x.id !== id && !(x.hasResource && x.published) && x.publishDate)
    .slice().sort((a, b) => (a.publishDate < b.publishDate ? -1 : 1));
  $('#repTarget').innerHTML = cands.length
    ? cands.map(x => '<option value="' + x.id + '">' + esc(x.publishDate) + ' ' + esc(x.name) + '</option>').join('')
    : '<option value="">暂无可顶替的排期</option>';
  $('#repDate').value = '';
  $('#repClash').style.display = 'none';
  $('#repMask').classList.add('show');
}
function checkRepClash() {
  const nd = $('#repDate').value, tid = $('#repTarget').value;
  const clash = list.find(x => x.id !== repMoverId && x.id !== tid && x.publishDate === nd);
  const el = $('#repClash');
  if (clash) { el.textContent = '该日期已有「' + clash.name + '」，确认后将同日发布'; el.style.display = 'block'; }
  else el.style.display = 'none';
}
async function doRep() {
  const tid = $('#repTarget').value, nd = $('#repDate').value;
  if (!tid) return toast('请选择被顶替的日期', true);
  if (!nd) return toast('请为被顶替者指定新日期', true);
  const clash = list.find(x => x.id !== repMoverId && x.id !== tid && x.publishDate === nd);
  if (clash && !confirm('该日期已有「' + clash.name + '」，确认同日发布？')) return;
  const mover = list.find(x => x.id === repMoverId);
  const target = list.find(x => x.id === tid);
  if (!mover || !target) return toast('记录不存在', true);
  mover.publishDate = target.publishDate;
  target.publishDate = nd;
  mover.updatedAt = Date.now();
  target.updatedAt = Date.now();
  closeMask('repMask');
  await save(list);
  toast('顶替成功');
}
$('#repDate').addEventListener('input', checkRepClash);
$('#repTarget').addEventListener('change', checkRepClash);

load();
</script>
</body>
</html>
