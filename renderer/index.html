<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具箱 ToolsHub</title>
  <link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="status-luxe.css" />
<link rel="stylesheet" href="cosmic-skin.css" />
<link rel="stylesheet" href="comic-skin.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-left">
        <span class="logo">🧰</span>
        <span class="title" data-text="工具箱 ToolsHub">工具箱 ToolsHub</span>
      </div>
      <div class="top-right">
        <span id="aggStatus" class="agg">初始化中…</span>
        <span id="updateStatus" class="update-status"></span>
        <button id="updateBtn" class="update-btn" title="点击检测更新">v—</button>
        <div class="skin-menu" id="skinMenu">
          <button id="themeBtn" class="icon-btn" title="切换皮肤"><span id="skinIcon">🌙</span></button>
          <div class="skin-drop" id="skinDrop">
            <button type="button" data-skin="dark">🌙 暗色</button>
            <button type="button" data-skin="light">☀️ 亮色</button>
            <button type="button" data-skin="cosmic">✦ 宇宙</button>
            <button type="button" data-skin="comic">★ 漫画</button>
          </div>
        </div>
        <span class="win-ctl">
          <button id="winMin" class="win-dot win-min" title="最小化" aria-label="最小化"></button>
          <button id="winMax" class="win-dot win-max" title="最大化/还原" aria-label="最大化/还原"></button>
          <button id="winClose" class="win-dot win-close" title="关闭" aria-label="关闭"></button>
        </span>
      </div>
    </header>

    <nav id="tabs" class="tabs" style="display:none">
      <!-- 动态标签 -->
    </nav>

    <main id="stage" class="stage">
      <!-- 入口页 -->
      <div id="landing" class="landing">
        <div class="landing-head">
          <div class="landing-titles">
            <div class="landing-title">工具统一入口</div>
            <div class="landing-sub">点击下方卡片打开对应工具，所有页面都在此窗口内运行</div>
          </div>
          <button id="sortBtn" class="sort-toggle" title="调整卡片顺序" aria-pressed="false">⇅ 调整顺序</button>
        </div>
        <div id="toolCards" class="cards"><!-- 动态生成 --></div>
        <div id="sortHint" class="sort-hint" hidden>拖动卡片调整顺序 · 用 ⇅ 方向键移动 · 点 ✓ 完成</div>
      </div>
      <!-- 子页面加载动画：webview 未就绪期间覆盖显示 -->
      <div id="stageLoading" class="stage-loading" hidden>
        <div class="sl-ring"></div>
        <div class="sl-text">正在<b class="sl-hl">加载</b>工具…</div>
      </div>
    </main>
  </div>

  <!-- 退出确认弹窗（自定义玻璃拟态，替代系统原生对话框） -->
  <div id="quitModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
      <div class="modal-title" id="quitTitle">退出确认</div>
      <div class="modal-msg">退出后工具箱将关闭，后台服务也会停止，是否继续？</div>
      <div class="modal-actions">
        <button id="quitCancel" class="btn-secondary" type="button">取消</button>
        <button id="quitConfirm" class="btn-danger" type="button">确认关闭</button>
      </div>
    </div>
  </div>

  <script src="drag-geometry.js"></script>
<script src="status-luxe.js"></script>
<script src="cosmic-skin.js"></script>
<script src="comic-skin.js"></script>
  <script src="app.js"></script>
</body>
</html>
