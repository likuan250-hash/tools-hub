<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>素材搜集 · tools-hub</title>
  <!-- 先加载本地 style.css（内含与 shared/tokens.css 同值的 fallback token 层），
       再加载 shared/tokens.css —— 后加载者胜出，token 单一真源仍是 shared/tokens.css；
       打包场景 shared/ 不可达时 404，由 fallback 层兜底，明暗双主题永不塌陷。 -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/shared/tokens.css" />
</head>
<body>
  <section class="card">
    <h2>游戏素材自动搜集</h2>
    <p class="sub">输入游戏名，自动按规则下载封面与官方宣传片，落盘到素材库</p>

    <div class="input-row">
      <input id="gameName" placeholder="例如：战神4 / Elden Ring / 黑神话：悟空" autocomplete="off" spellcheck="false" />
      <button class="btn-primary" id="collectBtn" type="button">开始搜集</button>
    </div>
    <div class="force-options" id="forceOptions">
      <label class="force-label"><input type="checkbox" id="forceTrailer" /> 重找视频</label>
      <label class="force-label"><input type="checkbox" id="forceCover" /> 重找封面</label>
      <input id="coverUrl" class="cover-url-input" placeholder="或指定封面图片 URL..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="rule-hint">
      规则 · 文件夹 <code>【游戏NNN】游戏名</code> · 封面 ≥1920×1080（壁纸站 → 官网 → YouTube → 主视频抽帧兜底）·
      宣传片官方 1080p MP4 · 落盘 <code>E:\素材\</code>
    </div>
    <div class="form-error" id="formError" role="alert"></div>

    <div class="state-tabs" id="stateTabs">
      <button type="button" data-state="empty" class="active">① 待输入</button>
      <button type="button" data-state="running" disabled>② 执行中</button>
      <button type="button" data-state="done" disabled>③ 完成</button>
    </div>

    <!-- ① 待输入 -->
    <div class="panel show" id="panel-empty">
      <div class="empty-note">在上方输入游戏名，点「开始搜集」即可自动执行</div>
    </div>

    <!-- ② 执行中：复用 kdocs 玻璃执行面板（.auto-result / .step-item / .log-card / .log-area） -->
    <div class="panel" id="panel-running">
      <div class="auto-result">
        <div id="autoSteps"></div>
        <details class="log-card" open>
          <summary>运行日志 <span class="chev"><i class="app-ico" data-ico="chevron"></i></span></summary>
          <div class="log-area" id="autoLog"></div>
        </details>
      </div>
    </div>

    <!-- ③ 完成：结果摘要 + 封面预览 + 产物卡片 + 落盘路径 -->
    <div class="panel" id="panel-done">
      <div class="result-summary" id="doneSummary">尚未执行</div>
      <div class="done-grid">
        <div class="cover-preview" id="coverPreview">
          <div class="cover-ico" id="coverIco"><i class="app-ico" data-ico="image"></i></div>
          <div id="coverName">封面待获取</div>
          <div class="cover-dim" id="coverDim"></div>
        </div>
        <div class="done-files" id="doneFiles"></div>
      </div>
      <div class="path-line" id="pathLine"></div>
    </div>
  </section>

  <!-- 交互式封面选择弹窗（cover_candidates 事件触发） -->
  <div class="cover-modal" id="coverModal" hidden>
    <div class="cover-modal-panel">
      <div class="cover-modal-head">
        <div>
          <div class="cover-modal-title" id="coverModalTitle">选择封面</div>
          <div class="cover-modal-sub" id="coverModalSub"></div>
        </div>
      </div>
      <div class="cover-modal-grid" id="coverModalGrid"></div>
      <div class="cover-modal-tip">缩略图直接加载远程图源，个别可能缓慢或失效（显示占位不影响选择）</div>
      <div class="cover-modal-actions">
        <button class="btn-ghost" id="coverAutoBtn" type="button">自动选第一个</button>
        <button class="btn-ghost" id="coverSkipBtn" type="button">跳过（走抽帧）</button>
        <button class="btn-primary" id="coverOkBtn" type="button" disabled>确定选用</button>
      </div>
    </div>
  </div>

  <script>
// 统一图标系统（单一来源；1.75 描边线性风格，跟随 currentColor）
// 铁律：全站零 emoji —— 任何状态/装饰符号一律走本系统的 SVG，不使用 🎮🖼✓✕● 之类字符。
window.ICONS = {
  gamepad: '<line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L6 20"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  film: '<rect x="2" y="3" width="20" height="18" rx="2"/><line x1="7" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="17" y2="21"/><line x1="2" y1="9" x2="7" y2="9"/><line x1="2" y1="15" x2="7" y2="15"/><line x1="17" y1="9" x2="22" y2="9"/><line x1="17" y1="15" x2="22" y2="15"/>',
  folder: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  check: '<path d="M5 13l4 4L19 7"/>',
  cross: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
  warning: '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  dot: '<circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>',
  chevron: '<polyline points="6 9 12 15 18 9"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'
};
window.ico = function (name) {
  var inner = window.ICONS[name];
  if (!inner) return '';
  return '<svg class="app-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
};
window.hydrateIcons = function (root) {
  (root || document).querySelectorAll('[data-ico]').forEach(function (el) {
    var n = el.getAttribute('data-ico');
    if (window.ICONS[n]) el.innerHTML = window.ico(n);
  });
};
hydrateIcons(document);
  </script>
  <script src="app.js"></script>
</body>
</html>
