<!-- viewBox 紧贴图形（机身 116..396 / 56..456 加 7px 描边），避免画布里留大片空白导致图标显小 -->
<svg width="294" height="414" viewBox="109 49 294 414" xmlns="http://www.w3.org/2000/svg">
  <!-- 掌机图标（红黄绿版）：机身红 #ff2e2e / 屏幕框黄 #ffe600 / 点阵与 A 键绿 #9dff5e / 描边黑 #111 -->
  <!-- 机身 -->
  <rect x="116" y="56" width="280" height="400" rx="26" fill="#ff2e2e" stroke="#111111" stroke-width="14"/>
  <!-- 屏幕框（黄） -->
  <rect x="146" y="92" width="220" height="140" rx="14" fill="#ffe600" stroke="#111111" stroke-width="10"/>
  <!-- LCD（黑底绿字） -->
  <rect x="162" y="106" width="188" height="112" rx="8" fill="#0b0f0b" stroke="#111111" stroke-width="8"/>
  <rect x="178" y="124" width="156" height="14" fill="#9dff5e"/>
  <rect x="178" y="152" width="112" height="14" fill="#9dff5e"/>
  <rect x="178" y="180" width="72" height="14" fill="#9dff5e"/>
  <!-- 电源灯（绿） -->
  <circle cx="172" cy="256" r="10" fill="#9dff5e" stroke="#111111" stroke-width="5"/>
  <!-- 十字方向键（黑） -->
  <rect x="181" y="310" width="32" height="88" rx="7" fill="#111111"/>
  <rect x="153" y="338" width="88" height="32" rx="7" fill="#111111"/>
  <!-- B 键（黄）/ A 键（绿） -->
  <circle cx="292" cy="352" r="27" fill="#ffe600" stroke="#111111" stroke-width="8"/>
  <circle cx="354" cy="322" r="27" fill="#9dff5e" stroke="#111111" stroke-width="8"/>
  <!-- 喇叭孔 -->
  <g stroke="#111111" stroke-width="9" stroke-linecap="round">
    <line x1="300" y1="410" x2="330" y2="392"/>
    <line x1="300" y1="432" x2="330" y2="414"/>
    <line x1="348" y1="410" x2="378" y2="392"/>
    <line x1="348" y1="432" x2="378" y2="414"/>
  </g>
</svg>
