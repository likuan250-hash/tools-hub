<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具箱 ToolsHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">🧰</span>
        <span class="title">工具箱 ToolsHub</span>
      </div>
      <div class="top-right">
        <span id="aggStatus" class="agg">初始化中…</span>
        <button id="themeBtn" class="icon-btn" title="切换主题">🌗</button>
      </div>
    </header>

    <nav id="tabs" class="tabs">
      <button class="tab active" data-key="kdocs">金山文档录入</button>
      <button class="tab" data-key="netdisk">网盘转存中转</button>
    </nav>

    <main id="stage" class="stage"><!-- 内嵌工具 webview 由 app.js 注入 --></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
