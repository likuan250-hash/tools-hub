name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app deps (electron + electron-builder)
        run: npm install --no-audit --no-fund

      - name: Install kdocs-tool deps
        working-directory: kdocs-tool
        run: npm install --no-audit --no-fund

      - name: Install netdisk-hub deps
        working-directory: netdisk-hub
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium (bundled into node_modules)
        working-directory: netdisk-hub
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: npx playwright install chromium

      - name: Write netdisk .env from secrets (optional)
        if: ${{ secrets.NETDISK_ENV != '' }}
        working-directory: netdisk-hub
        run: echo "${{ secrets.NETDISK_ENV }}" > .env

      - name: Prepare bundled Node runtime
        run: |
          $nodeDir = "resources/node"
          New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
          $nodeBin = (Get-Command node).Source
          Copy-Item $nodeBin (Join-Path $nodeDir "node.exe")
          Write-Host "copied node runtime: $nodeBin"

      # 可选：打包 bl（bailian-cli）资源，使 kdocs 介绍/大小/封面功能完整。
      # 其运行依赖三个内部包（bailian-cli-commands/-core/-runtime），CI 默认无法获取，
      # 故默认不出 bl（kdocs 自动降级，仅介绍/大小/封面缺失）。
      # 如需 CI 自动含 bl：配置 secrets.NPMRC（私有 registry 凭据），取消下方注释：
      # - name: Setup npmrc (optional)
      #   if: ${{ secrets.NPMRC != '' }}
      #   run: echo "${{ secrets.NPMRC }}" > .npmrc
      # - name: Install bailian-cli (optional)
      #   if: ${{ secrets.NPMRC != '' }}
      #   run: |
      #     npm install -g bailian-cli
      #     Copy-Item (Join-Path (npm root -g) "bailian-cli") "resources/bin/node_modules/bailian-cli" -Recurse -Force
      # 本地出完整包：直接把本机 bl 资源复制到 resources/bin/ 后 npm run dist 即可。

      - name: Build NSIS installer
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          # 不签名（无证书），安装时会有“未知发布者”提示，属正常
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolsHub-Setup
          path: dist/*.exe
          if-no-files-found: error
